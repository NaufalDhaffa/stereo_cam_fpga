# Network of the board. ADDRESS=dhcp or a fixed address/prefix.
# 169.254.x.x is the link-local range: a PC whose Ethernet adapter has such an address reaches the
# board over a direct cable without any setting on the PC.
ADDRESS=169.254.179.10/16
GATEWAY=
# 100 = force 100 Mbit/s full duplex (auto-negotiation fell back to 10 Mbit/s on this board); empty = negotiate
SPEED=100

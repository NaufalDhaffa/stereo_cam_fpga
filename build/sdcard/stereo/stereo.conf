# Settings of stereo_cam.py on the board (the "mini" build: sensor 400 x 296 at 15 fps).
SIZE=cif
FORMAT=rgb565
CLKRC=0x83
DVP=0x82
VFLIP=1
HMIRROR=1
LINE_US=198.4
PIXEL_US=112
FRAME_LINES=336
EXTRA_LINES=0
# camera 1's frame start minus camera 0's that the bitstream's tables expect (written by host/board.py)
GENLOCK_LEAD_US=4365
# 1: the third USB stream carries the disparity
DEPTH_STREAM=1
# 1: webcam (USB Video Class) output; 0: the three streams of the PC tools (host/mini_view.py)
UVC=1
